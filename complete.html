/* 点滅アニメーション */
@keyframes blink {
  0% { opacity: 1; }
  50% { opacity: 0.4; }
  100% { opacity: 1; }
}

a {
  display: inline-block;
  padding: 15px 30px;
  background: red;
  color: white;
  text-decoration: none;
  font-weight: bold;
  border-radius: 8px;
  animation: blink 1s infinite;
}

a:hover {
  background: darkred;
}
</style>
